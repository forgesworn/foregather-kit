name: native bindings
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foreign-consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: rustup override set 1.94.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-uniffi0322-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Kotlin compiler
        shell: bash
        run: |
          mkdir -p target/native-tooling
          curl --fail --location --retry 2 https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip -o target/native-tooling/kotlin.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          archive = Path('target/native-tooling/kotlin.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d'
          with zipfile.ZipFile(archive) as source:
              source.extractall('target/native-tooling/kotlin')
          Path('target/native-tooling/kotlin/kotlinc/bin/kotlinc').chmod(0o755)
          PY
          echo "$PWD/target/native-tooling/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - run: node scripts/build-native.mjs check
