name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wasm-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: rustup override set 1.94.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-rust1941-bindgen0129-deny0190-audit0221-${{ hashFiles('Cargo.lock') }}
      - run: command -v wasm-bindgen && wasm-bindgen --version | rg '^wasm-bindgen 0.2.129$' || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: python3 -m venv target/pake-reference-venv
      - run: target/pake-reference-venv/bin/pip install -r scripts/reference-requirements.txt
      - run: target/pake-reference-venv/bin/python scripts/check-pake-reference.py
      - run: node scripts/check-package.mjs
      - run: cargo package --locked -p foregather-kit --all-features --allow-dirty
      - run: npm audit
      - run: command -v cargo-deny && cargo deny --version | rg '0.19.0' || cargo install cargo-deny --version 0.19.0 --locked
      - run: cargo deny check licenses sources
      - run: command -v cargo-audit && cargo audit --version | rg '0.22.1' || cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foregather-release
          path: target/release-artifacts/current/
          if-no-files-found: error
          retention-days: 14
