[workspace]
members = ["crates/foregather-kit", "crates/foregather-wasm", "crates/foregather-server"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["TheCryptoDonkey"]
repository = "https://github.com/forgesworn/foregather-kit"
homepage = "https://github.com/forgesworn/foregather-kit"

[workspace.dependencies]
foregather-kit = { path = "crates/foregather-kit", version = "0.3.1" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
