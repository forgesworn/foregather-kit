[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

# UniFFI's unmodified native binding runtime and generators retain their MPL
# licence and source attribution. Foregather's own code remains MIT.
[[licenses.exceptions]]
name = "uniffi"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_internal_macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_macros"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_meta"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
name = "uniffi_pipeline"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
