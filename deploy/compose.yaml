services:
  foregather:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: foregather.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - foregather-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  foregather-data:
